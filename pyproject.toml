[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-portfolio-analysis"
version = "2.8.0"
description = "带机械双门禁的每日持仓分析 skill（证据门 + 报告门）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Li Haoyang" }]
keywords = ["stock", "portfolio", "skill", "workbuddy", "report"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
# 可选：装了能自动拉行情/财务；不装也能跑（脚本会生成待补骨架）
data = ["akshare>=1.12", "yfinance>=0.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Documentation = "README.md"

[tool.setuptools]
# 纯脚本项目：不打包成 Python 包，仅用于依赖与工具配置
packages = []

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".archive", "data", "config"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# 中文注释与长字符串较多，不强求 88 列
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"
